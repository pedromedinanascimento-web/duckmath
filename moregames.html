<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬Chat</title>
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #121212;
        font-family: Arial, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    h1 {
        margin: 40px 0 20px 0;
        text-align: center;
    }

    /* Container do chat */
    #tlkio {
        width: 100%;
        max-width: 1800px;     /* largura maior */
        height: 450px;         /* altura menor */
        border: 2px solid #444;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        position: relative;
    }

    /* Força o iframe interno do TLK.io a obedecer tamanho */
    #tlkio iframe {
        width: 100% !important;
        height: 100% !important;
        border: none;
    }
</style>
</head>
<body>
<h1>💬 Chat com Todos</h1>
<div id="tlkio" data-channel="pedromatematicachatpvv" data-theme="theme--night"></div>
<script async src="https://tlk.io/embed.js" type="text/javascript"></script>
</body>
</html>
