<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat em Tempo Real</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        #tlkio {
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h1>Chat do PedroMatematica</h1>

    <div id="tlkio" data-channel="pedromatematica" data-theme="theme--night" style="width:100%;height:400px;"></div>
    
    <script async src="http://tlk.io/embed.js" type="text/javascript"></script>
</body>
</html>
