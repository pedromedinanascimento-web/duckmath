<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/text_styles.css" />

    <!-- Main script -->

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/img/duck.webp" />

    <style>
        body {
            background: url('https://pedromatematica.vercel.app/assets/img/bg.svg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-top: 70px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            font-size: 16px;
            background: #222;
            color: #fff;
            border: 2px solid #444;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #333;
            transform: scale(1.03);
        }

        .disabled {
            background: #111;
            border-color: #333;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
