<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬Chat</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* centraliza verticalmente */
        }

        h1 {
            margin-bottom: 20px; /* espaço entre título e chat */
            text-align: center;
        }

        #tlkio {
            width: 90%;           /* largura proporcional */
            max-width: 800px;     /* tamanho máximo */
            height: 500px;        /* altura fixa */
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <h1>💬 Chat com Todos</h1>
    <div id="tlkio" data-channel="pedromatematicachatpvv" style="width:100%;height:100%;"></div>
    <script async src="https://tlk.io/embed.js" type="text/javascript"></script>
</body>
</html>
