<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬Chat</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
    #tlkio {
        width: 90%;           /* diminui a largura total */
        max-width: 800px;     /* limita o tamanho máximo */
        height: 500px;
        border: 2px solid #444;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        margin: 0 auto;       /* centraliza horizontalmente */
    }
    </style>
</head>
<body>
    <h1>💬 Chat com Todos</h1>

    <div id="tlkio" data-channel="pedromatematicachatpvv" style="width:100%;height:100%;"></div>

    <script async src="https://tlk.io/embed.js" type="text/javascript"></script>
</body>
</html>
