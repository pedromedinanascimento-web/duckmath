<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Undertale</title>

<link rel="stylesheet" href="/assets/css/text_styles.css" />
<link rel="stylesheet" href="/assets/css/topnav.css" />
<link rel="stylesheet" href="/assets/css/main.css" />

<script src="/assets/js/main.js"></script>

<link rel="icon" type="image/x-icon" href="/assets/img/duck.webp" />
<link rel="mask-icon" href="/assets/img/duck.webp" color="#111" />

<noscript>
  Your browser doesn't have JavaScript enabled.
</noscript>

<script src="/assets/js/index.js" type="text/javascript" defer></script>

<style>
    body {
        background: url('https://pedromatematica.vercel.app/assets/img/bg.svg') no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        padding-top: 70px;
    }

    h1 {
        margin-bottom: 20px;
    }

    .game-container {
        width: 100%;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    iframe {
        width: 100%;
        height: 600px;
        border: 0;
        border-radius: 16px;
        margin-top: 20px;
    }

    .btn {
        margin-top: 15px;
        padding: 12px 20px;
        font-size: 16px;
        background: #222;
        color: #fff;
        border: 2px solid #444;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
        background: #333;
        transform: scale(1.08);
    }
</style>

<script>
function goFullscreen() {
    const iframe = document.getElementById("gameFrame");

    if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) { // Safari
        iframe.webkitRequestFullscreen();
    } else if (iframe.msRequestFullscreen) { // IE
        iframe.msRequestFullscreen();
    }
}
</script>

</head>

<body>

<div id="topnav"></div>

<h1>Undertale</h1>

<div class="game-container">
    <iframe 
        id="gameFrame"
        src="https://www.autistici.org/burnedprojects/UNDERTALE/"
        scrolling="yes"
        allowfullscreen>
    </iframe>

    <button class="btn" onclick="goFullscreen()">
        Fullscreen
    </button>
</div>

</body>
</html>
